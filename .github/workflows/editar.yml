name: Editar video

on:
  workflow_dispatch:
    inputs:
      video:
        description: 'Video a editar (ej: entrada/mi-video.mp4)'
        required: true
      estilo:
        description: 'Estilo (carpeta en estilos/)'
        default: 'juesar'
      escenas:
        description: 'Generar escenas de apoyo (imágenes IA, animaciones)'
        type: boolean
        default: true
      reexportar:
        description: 'Solo volver a exportar con el guion guardado en resultados/ (no transcribe)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  editar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VIDEO: ${{ inputs.video }}
      ESTILO: ${{ inputs.estilo }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar FFmpeg, Whisper, Silero y OpenCV
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper "opencv-python-headless<5"

      - name: Caché del modelo de voz
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Instalar editor
        run: npm install --no-audit --no-fund && npx remotion browser ensure

      - name: Nombre del video
        run: echo "NOMBRE=$(basename "$VIDEO" | sed 's/\.[^.]*$//')" >> "$GITHUB_ENV"

      - name: Transcribir, armar guion y escenas
        if: ${{ !inputs.reexportar }}
        run: node scripts/auto.mjs "$VIDEO" --estilo "$ESTILO" ${{ inputs.escenas && ' ' || '--sin-escenas' }}

      - name: Usar guion guardado
        if: ${{ inputs.reexportar }}
        run: |
          mkdir -p public/escenas
          cp -r "resultados/$NOMBRE/escenas/." public/escenas/ 2>/dev/null || true
          node scripts/auto.mjs "$VIDEO" --usar-guion "resultados/$NOMBRE/guion.json"
          node scripts/escenas.mjs --solo-imagenes

      - name: Exportar video
        run: npx remotion render src/index.ts Edicion "out/$NOMBRE-editado.mp4"

      - name: Guardar guion y escenas en resultados/
        run: |
          mkdir -p "resultados/$NOMBRE/escenas"
          cp guion.json "resultados/$NOMBRE/guion.json"
          cp -r public/escenas/. "resultados/$NOMBRE/escenas/" 2>/dev/null || true
          git config user.name "editor-bot"
          git config user.email "editor-bot@users.noreply.github.com"
          git add "resultados/$NOMBRE"
          git commit -m "Resultado: $NOMBRE" || echo "sin cambios"
          git pull --rebase -q && git push

      - name: Descargar video editado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOMBRE }}-editado
          path: out/*.mp4
          retention-days: 14
